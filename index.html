<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Token Claim Portal</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --primary-color: #9945ff; /* Solana Purple */
            --secondary-color: #14f195; /* Solana Green */
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --error-color: #ff4444;
            --success-color: #00C851;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #0d0d0d 100%);
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #333;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            color: #000;
            margin: 0 auto 1rem auto;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .btn-connect {
            background: linear-gradient(90deg, var(--primary-color), #6a30a6);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(153, 69, 255, 0.4);
        }

        .btn-connect:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            word-break: break-word;
        }

        .status.visible {
            display: block;
        }

        .status.loading {
            background-color: rgba(153, 69, 255, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(153, 69, 255, 0.2);
        }

        .status.success {
            background-color: rgba(20, 241, 149, 0.1);
            color: var(--secondary-color);
            border: 1px solid rgba(20, 241, 149, 0.2);
        }

        .status.error {
            background-color: rgba(255, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(255, 68, 68, 0.2);
        }

        .status.warning {
            background-color: rgba(255, 165, 0, 0.1);
            color: orange;
            border: 1px solid rgba(255, 165, 0, 0.2);
        }

        .wallet-address {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        /* Phantom Icon */
        .phantom-icon {
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo/Icon -->
        <div class="logo">S</div>
        
        <h1>Solana Token Claim</h1>
        <p>Connect your Phantom wallet to verify eligibility and claim your allocated tokens securely.</p>

        <!-- Button -->
        <button id="connect-wallet" class="btn-connect">
            <span>Connect Phantom</span>
        </button>

        <!-- Status Messages -->
        <div id="status" class="status"></div>
        
        <!-- Wallet Address (Optional, shown after connect) -->
        <div id="wallet-address" class="wallet-address"></div>
    </div>

    <!-- Solana Web3.js Library -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <!-- Your Script -->
    <script src="scripts.js"></script>

</body>
</html>
