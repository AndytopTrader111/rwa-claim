<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWA Claim | Fractionalized Assets</title>
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: #0f0f12;
            --primary: #9d4edd;
            --primary-hover: #7b2cbf;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #2a2a2a;
            --success: #00ff9d;
            --error: #ff0055;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #050505 70%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 100px rgba(157, 78, 221, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle glow effect */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .logo span { color: var(--primary); }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .asset-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            display: none; /* Hidden until connected */
        }

        .asset-info h3 {
            margin: 0;
            font-size: 16px;
            color: var(--success);
        }

        .asset-info p {
            margin: 5px 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
            position: relative;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">RWA <span>Claim</span></div>
            <div class="subtitle">Fractionalized Asset Distribution</div>

            <div class="asset-info" id="assetInfo">
                <h3>Eligible Assets Detected</h3>
                <p>High-value NFTs & Tokenized Assets verified.</p>
            </div>

            <button class="btn" id="claimBtn" onclick="handleClaim()">
                Verify & Claim
            </button>

            <div class="status" id="statusText"></div>
        </div>
    </div>

    <script>
        function handleClaim() {
            const btn = document.getElementById('claimBtn');
            const status = document.getElementById('statusText');
            const assetInfo = document.getElementById('assetInfo');

            // 1. Disable button and show spinner
            btn.disabled = true;
            btn.innerText = "Verifying...";
            status.innerHTML = '<div class="spinner"></div> Verifying On-Chain...';

            // 2. Simulate network delay (fake loading)
            setTimeout(() => {
                assetInfo.style.display = 'block';
                status.innerHTML = '<div class="spinner"></div> Connecting Wallet...';
            }, 1500);

            setTimeout(() => {
                status.innerHTML = '<div class="spinner"></div> Approving Claim...';
                btn.innerText = "Sign Transaction";
                btn.disabled = false;
                // Here you would trigger Phantom/Solana connection
                // For now, just alert the user to sign
                alert("Wallet Connected! Sign the transaction to claim.");
            }, 3500);
        }
    </script>
</body>
</html>
